name: pulse

on:
  push:
    branches:
      - main
  schedule:
    # 00:10 in America/Mexico_City (UTC-6).
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check today's pixel
        run: python tools/contribution_gate.py status
